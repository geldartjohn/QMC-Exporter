<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>QMC Static Table Fixture</title>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Owner</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Sales Overview</td>
            <td>admin@example.test</td>
            <td>Published</td>
          </tr>
          <tr>
            <td>Operations Monitor</td>
            <td>ops@example.test</td>
            <td>Draft</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
