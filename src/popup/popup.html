<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Qlik Table Exporter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" data-app>
      <header class="app__header">
        <div>
          <span class="app__eyebrow">Qlik Sense + Cloud</span>
          <h1 class="app__title">Table Exporter</h1>
          <p class="app__subtitle">Export the visible page or full paginated table from the active Qlik tab.</p>
        </div>
        <button type="button" class="app__refresh" data-refresh>Refresh</button>
      </header>

      <section class="app__section app__section--status" data-status>
        <span class="status__message">Scanning…</span>
      </section>

      <section class="app__section app__section--controls" data-controls hidden>

        <div class="field-grid">
          <label class="field">
            <span class="field__label">Format</span>
            <select class="field__control" data-format-select>
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
              <option value="xml">XML</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Rows</span>
            <select class="field__control" data-scope-select>
              <option value="visible">Visible page</option>
              <option value="allPages">Full table</option>
            </select>
          </label>
        </div>

        <label class="checkbox">
          <input type="checkbox" data-include-headers checked>
          <span>Include headers</span>
        </label>

        <button type="button" class="app__export" data-export>Export</button>
      </section>

      <footer class="app__footer">
        <span data-version>Version -</span>
        <a class="app__footer-link" href="https://github.com/geldartjohn/QMC-Exporter" target="_blank" rel="noopener noreferrer">
          <span>Source Code</span>
          <img src="../../images/github-mark.png" alt="GitHub" width="16" height="16">
        </a>
      </footer>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
